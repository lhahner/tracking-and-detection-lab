name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize SimpleTrack submodule
      run: git submodule update --init --depth 1 third_party/SimpleTrack

    - name: Initialize AB3DMOT submodule
      run: git submodule update --init --depth 1 third_party/AB3DMOT

    - name: Initialize Xinshuo_PyToolbox submodule
      run: git submodule update --init --depth 1 third_party/Xinshuo_PyToolbox

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Anaconda Setup
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-activate: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        chmod a+x ./install.sh
        ./install.sh
    - name: Test with pytest
      run: |
        conda run -n track-lab pytest
